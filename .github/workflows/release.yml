name: Release

on:
  push:
    tags:
      - 'v*'

permissions: read-all

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section for this release
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Slice the block that starts with "## [VERSION]" up to (not including) the next "## [" line.
          # Uses awk so no shell expansion of untrusted content occurs.
          BODY=$(awk -v ver="## [${VERSION}]" '
            found && /^## \[/ { exit }
            found { print }
            index($0, ver) == 1 { found=1 }
          ' CHANGELOG.md)

          if [ -z "$BODY" ]; then
            BODY="See [CHANGELOG.md](CHANGELOG.md) for details."
          fi

          # Write to a temp file to avoid any quoting / injection issues with multiline strings.
          printf '%s' "$BODY" > /tmp/release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: /tmp/release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
