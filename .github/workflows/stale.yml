name: Stale Issues and PRs

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Mark and close stale issues and PRs
        uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          exempt-issue-labels: 'pinned,security'
          exempt-pr-labels: 'pinned,security'
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            any activity in the last 60 days. It will be closed in 14 days unless
            further activity occurs. Thank you for your contributions!
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has
            not had any activity in the last 60 days. It will be closed in 14 days
            unless further activity occurs. Thank you for your contributions!
          close-issue-message: >
            This issue has been automatically closed due to inactivity. Feel free
            to reopen it if the issue is still relevant.
          close-pr-message: >
            This pull request has been automatically closed due to inactivity. Feel
            free to reopen it if you would like to continue working on it.
