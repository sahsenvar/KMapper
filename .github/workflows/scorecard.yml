name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly on Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  push:
    branches: [ main ]
  workflow_dispatch: # allow on-demand security scans / verifying the workflow after a fix

# Top level stays read-only: the OpenSSF publish-verification rejects results from a
# workflow that holds global write permissions (HTTP 400 "global perm is set to write").
# The write scopes the analysis needs live at the job level instead.
permissions: read-all

jobs:
  analyze:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF to the code-scanning dashboard
      id-token: write # publish results to the OpenSSF Scorecard API (publish_results)
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run analysis
        # No floating major tag exists for this action — pin to a released version.
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning dashboard
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          sarif_file: results.sarif
