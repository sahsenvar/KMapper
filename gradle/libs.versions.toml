[versions]
kotlin = "2.3.10"
ksp = "2.3.10"
kotlinpoet = "2.3.0"
agp = "9.2.1"
kotlinx-datetime = "0.6.0"
kotlinx-collections-immutable = "0.5.1"
kotlinx-serialization = "1.11.0"
# Pinned to 2.1.x: arrow-core 2.2.x is compiled with Kotlin 2.4 (klib ABI 2.4.0), which the
# Kotlin/Native 2.3.10 compiler used here cannot consume — it breaks every native target.
# Revisit when KMapper upgrades to Kotlin 2.4 (see the arrow-core dependabot ignore).
arrow = "2.1.2"
ionspin-bignum = "0.3.10"
# kctfork 0.12.1 — KSP2-aware maintained fork of kotlin-compile-testing
compile-testing = "0.13.0"
vanniktech-publish = "0.37.0"
kotest = "6.2.2"
okio = "3.17.0"
bcv = "0.18.1"
dokka = "2.2.0"
spotless = "8.8.0"
kover = "0.9.8"

[libraries]
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
kotlinpoet = { module = "com.squareup:kotlinpoet", version.ref = "kotlinpoet" }
kotlinpoet-ksp = { module = "com.squareup:kotlinpoet-ksp", version.ref = "kotlinpoet" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinx-collections-immutable" }
# Annotations only (@Serializable/@SerialName) — read by the processor via FQN; used in tests/sample. No runtime dep in core/compiler.
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
compile-testing-core = { module = "dev.zacsweers.kctfork:core", version.ref = "compile-testing" }
compile-testing-ksp = { module = "dev.zacsweers.kctfork:ksp", version.ref = "compile-testing" }
arrow-core = { module = "io.arrow-kt:arrow-core", version.ref = "arrow" }
ionspin-bignum = { module = "com.ionspin.kotlin:bignum", version.ref = "ionspin-bignum" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property   = { module = "io.kotest:kotest-property", version.ref = "kotest" }
kotest-framework-engine = { module = "io.kotest:kotest-framework-engine", version.ref = "kotest" }
# NOTE: no kotest-framework-datatest entry — in Kotest 6.x the datatest module (io.kotest.datatest.withData)
# was merged into kotest-framework-engine; the standalone artifact stopped at 5.9.1.
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
vanniktech-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech-publish" }
bcv = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "bcv" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
